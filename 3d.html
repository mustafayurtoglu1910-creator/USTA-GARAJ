// Egea Sedan için daha akıcı dış gövde: yuvarlatılmış profil geometrileri
function profileMesh(parent,name,points,width,material,bevel=.06){
  const shape=new THREE.Shape();
  shape.moveTo(points[0][0],points[0][1]);
  for(let i=1;i<points.length;i++){
    const p=points[i];
    if(p.length===4) shape.quadraticCurveTo(p[0],p[1],p[2],p[3]);
    else shape.lineTo(p[0],p[1]);
  }
  shape.closePath();
  // Gerçek araç siluetine yaklaşmak için gövde yan sacında teker boşlukları
  if(name==='Gövde'){
    for(const centerZ of [-2.15,2.15]){
      const wheelOpening=new THREE.Path();
      wheelOpening.absarc(centerZ,.48,.665,0,Math.PI*2,true);
      shape.holes.push(wheelOpening);
    }
  }
  const geo=new THREE.ExtrudeGeometry(shape,{depth:width,bevelEnabled:true,bevelSegments:4,steps:1,bevelSize:bevel,bevelThickness:bevel*.7,curveSegments:20});
  geo.rotateY(Math.PI/2);
  const mesh=new THREE.Mesh(geo,material);
  mesh.position.x=-width/2;
  mesh.castShadow=true;mesh.receiveShadow=true;mesh.userData.part=name;parent.add(mesh);
  return mesh;
}

function loftBody(name,sections,material){
  const ring=[
    [0,.32],[.78,.32],[.94,.39],[1,.55],[1,.78],[.94,.91],[.72,.97],[0,.985],
    [-.72,.97],[-.94,.91],[-1,.78],[-1,.55],[-.94,.39],[-.78,.32]
  ];
  const verts=[],indices=[];
  for(const s of sections){
    for(const [xf,y] of ring) verts.push(xf*s.w,y*s.h,s.z);
  }
  const n=ring.length;
  for(let j=0;j<sections.length-1;j++)for(let i=0;i<n;i++){
    const a=j*n+i,b=j*n+(i+1)%n,d=(j+1)*n+i,e=(j+1)*n+(i+1)%n;
    indices.push(a,b,d,b,e,d);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setIndex(indices);g.computeVertexNormals();
  const m=new THREE.Mesh(g,material);m.userData.part=name;m.castShadow=true;m.receiveShadow=true;car.add(m);return m;
}

function hose(name,points,radius,color){
  const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));
  const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,32,radius,12,false),mat(color,.08,.48));
  mesh.userData.part=name;mesh.castShadow=true;mesh.receiveShadow=true;car.add(mesh);return mesh;
}
function ribbedHose(name,points,radius,color){
  const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));
  const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,36,radius,12,false),mat(color,.04,.72));
  mesh.userData.part=name;mesh.castShadow=true;mesh.receiveShadow=true;car.add(mesh);
  const frames=curve.computeFrenetFrames(36,false);
  for(let i=3;i<34;i+=3){
    const ring=new THREE.Mesh(new THREE.TorusGeometry(radius*1.03,.012,6,14),mat(0x353b3f,.18,.65));
    ring.position.copy(curve.getPointAt(i/36));
    ring.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),frames.tangents[i]);
    ring.userData.part=name+' körük halkası '+i;car.add(ring);
  }
  return mesh;
}
function bolt(name,x,y,z,size=.055){

const originalParents=new Map(),originalPositions=new Map();
function moveToShelf(mesh){if(!mesh||shelfItems.has(mesh))return;const parent=mesh.parent;originalParents.set(mesh,parent);originalPositions.set(mesh,mesh.position.clone());parent.remove(mesh);shelf.add(mesh);const slot=shelfCount++;mesh.position.set(-.55+(slot%3)*.55,1.28+Math.floor(slot/3)*.36,.12);mesh.scale.setScalar(.55);shelfItems.set(mesh,slot);mesh.visible=true;}
function restoreFromShelf(mesh){if(!mesh||!shelfItems.has(mesh))return;const parent=originalParents.get(mesh);shelf.remove(mesh);parent.add(mesh);mesh.position.copy(originalPositions.get(mesh));mesh.scale.set(1,1,1);mesh.visible=true;shelfItems.delete(mesh);shelfCount=Math.max(0,shelfCount-1);}
renderer.domElement.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY});
